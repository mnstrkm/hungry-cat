function bodyScale(w){const s=CONFIG.WEIGHT;return w<=s.start?lerp(s.sizeMin,s.sizeStart,w/s.start):lerp(s.sizeStart,s.sizeMax,(w-s.start)/(s.max-s.start))}

function settings(t=run?.time||0){if(mode!=='endless')return CONFIG.MODES[mode];const e=CONFIG.ENDLESS,u=clamp(t/e.ramp,0,1),smooth=u*u*(3-2*u),late=Math.max(0,t-e.ramp);return{name:'Endlos',duration:Infinity,speed:lerp(e.startSpeed,e.endSpeed,smooth)*(1+late*e.lateSpeedPerSecond),interval:e.startInterval.map((n,i)=>Math.max(e.minInterval,lerp(n,e.endInterval[i],smooth)/(1+late*.002))),cap:lerp(e.startCap,e.endCap,smooth),tolerance:lerp(7,0,smooth),pause:lerp(e.startPause,0,smooth),grace:lerp(.32,.21,smooth)}}

function choose(m){mode=m;if(m==='endless'){profiles();return}beginWithTutorial()}
function beginWithTutorial(){if(!data.tutorial)tutorial();else start(mode)}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');noticeTime=.85}
function clearUIEffects(){noticeTime=0;$('#toast').classList.remove('show')}
function showPanel(html){overlay.innerHTML='<section class="panel">'+html+'</section>';overlay.classList.remove('hidden');soundButtons()}
function menu(){state='menu';audio.stop();run=null;clearUIEffects();$('#hud').classList.add('hidden');$('#foot').classList.add('hidden');showPanel(`<div class="eyebrow">Kleine Katze. Großer Hunger.</div><h1>${escapeHTML(CONFIG.TITLE)}</h1><div class="hero"><canvas id="hero"></canvas></div><p class="subtitle">Essen wegtippen. Spielzeug liegen lassen.<br>Und die Miez? Bloß nicht platzen lassen.</p><div class="modes"><button class="mode" data-mode="cozy"><strong>Gemütlich</strong><small>60 s · Immer mit der Ruhe.</small></button><button class="mode normal" data-mode="normal"><strong>Normal</strong><small>60 s · Flinke Finger gefragt.</small></button><button class="mode" data-mode="hard"><strong>Schwer</strong><small>75 s · Jetzt wird’s hektisch.</small></button><button class="mode unfair" data-mode="unfair"><strong>Unfair</strong><small>90 s · Du wurdest gewarnt.</small></button><button class="mode endless" data-mode="endless"><div><strong>Endlos</strong><small>Deine Miez. Dein Rekord.</small></div><strong>∞ →</strong></button></div><div class="menu-bottom"><button class="text-button" id="leader">Bestenliste</button><button class="text-button" id="help">So geht’s</button><button class="icon-button sound"></button></div>`);hero=$('#hero');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{audio.unlock();choose(b.dataset.mode)});$('#leader').onclick=()=>leaderboard();$('#help').onclick=()=>tutorial(true)}
function tutorial(help=false){hero=null;state='tutorial';showPanel(`<div class="eyebrow">Drei Regeln. Eine hungrige Miez.</div><h2>Ganz einfach.</h2><div class="rule">${svgMarkup('burger')}<div><b>Essen → wegtippen</b><small>Bevor die Katze es erwischt.</small></div></div><div class="rule">${svgMarkup('yarn')}<div><b>Spielzeug → liegen lassen</b><small>Das macht die Miez wieder dünner.</small></div></div><div class="rule"><svg viewBox="0 0 60 60"><path d="m30 3 6 15 15-8-4 18 12 7-17 6-1 17-13-12-17 9 3-20L2 26l18-5Z" fill="#eab890"/><text x="30" y="39" font-size="26" text-anchor="middle" fill="#714d39">!</text></svg><div><b>Zu viel gefressen? PLOPP!</b><small>Je voller der Bauch, desto näher das Ende.</small></div></div><button class="primary" id="go">${help?'Alles klar':'Verstanden. Los geht’s!'}</button>`);$('#go').onclick=()=>{data.tutorial=true;save();help?menu():start(mode)}}
function profiles(message=''){state='profiles';hero=null;clearUIEffects();showPanel(`<div class="eyebrow">Endlos · Lokale Rekorde</div><h2>Wer spielt?</h2><p class="subtitle">Wähle deinen Namen und leg los.</p><div class="players">${data.profiles.map((p,i)=>`<button class="player" data-player="${i}"><b>${escapeHTML(p.name)}</b><span>${fmt(p.highscore)} →</span></button>`).join('')||'<p class="subtitle">Die erste Miez wartet auf ihren Menschen.</p>'}</div><form id="newPlayer"><input id="name" aria-label="Neuer Spieler" placeholder="Neuer Spieler" maxlength="16" autocomplete="off"><button aria-label="Spieler erstellen">+</button></form><p class="notice" id="error">${escapeHTML(message)}</p><button class="secondary" id="back">Menü</button><p class="subtitle" style="margin-bottom:0">${storageOK?'Rekorde bleiben in diesem Browser.':'Speichern ist hier gesperrt. Profile gelten nur für diese Sitzung.'}</p>`);document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{profile=data.profiles[+b.dataset.player];beginWithTutorial()});$('#newPlayer').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim().slice(0,CONFIG.MAX_NAME);if(!name){$('#error').textContent='Bitte gib einen Namen ein.';return}if(data.profiles.some(p=>p.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))){$('#error').textContent='Diesen Spieler gibt es schon. Wähle ihn oben aus.';return}profile={name,highscore:0};data.profiles.push(profile);save();beginWithTutorial()};$('#back').onclick=menu}
function leaderboard(){state='leaderboard';hero=null;clearUIEffects();$('#hud').classList.add('hidden');$('#foot').classList.add('hidden');showPanel(`<div class="eyebrow">Nur Endlos zählt hier</div><h2>Die flinksten Finger.</h2><div class="players">${[...data.profiles].sort((a,b)=>b.highscore-a.highscore).map((p,i)=>`<div class="player"><b>${i+1}. ${escapeHTML(p.name)}</b><span>${fmt(p.highscore)}</span></div>`).join('')||'<p class="subtitle">Noch keine Rekorde.<br>Dein erster Run wartet!</p>'}</div><button class="primary" id="endless">Endlos spielen</button><button class="secondary" id="back">Menü</button>`);$('#endless').onclick=()=>{mode='endless';profiles()};$('#back').onclick=menu}
function pause(){if(state!=='playing')return;state='paused';audio.stop();clearUIEffects();showPanel('<div class="eyebrow">Einmal durchatmen</div><h2>Miez macht Pause.</h2><p class="subtitle">Dein Bauch-Chaos wartet auf dich.</p><button class="primary" id="resume">Fortsetzen</button><button class="secondary" id="restart">Neustart</button><button class="text-button" id="back">Zum Menü</button>');$('#resume').onclick=()=>{audio.unlock();state='playing';overlay.classList.add('hidden');lastFrame=performance.now()};$('#restart').onclick=()=>start();$('#back').onclick=menu}
$('#pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state==='playing')pause();else if(state==='paused')$('#resume').click()}});
// ── Objekte, Treffer und Punkte ───────────────────────────────────────────
function nearest(){let best=null,dist=Infinity;for(const o of run.objects){const d=Math.hypot(o.x-run.cat.x,o.y-run.cat.y);if(d<dist){best=o;dist=d}}return best}
function spawnPosition(r){const p=settings(),c=run.cat,minCat=radius()+r+p.speed*S*weightSpeed(c.weight)*p.grace;for(let i=0;i<CONFIG.FIELD.spawnAttempts;i++){const x=rand(bounds.left+r,bounds.right-r),y=rand(bounds.top+r,bounds.bottom-r);if(bounds.right-bounds.left<2*r||bounds.bottom-bounds.top<2*r)return null;if(Math.hypot(x-c.x,y-c.y)<minCat)continue;if(run.objects.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+CONFIG.FIELD.separation*S))continue;return{x,y}}return null}
function spawn(){const p=settings();/* Fractional cap eases the chance of filling the next slot. */const cap=Math.min(CONFIG.MAX_OBJECTS,Math.floor(p.cap)+(Math.random()<p.cap%1?1:0));if(run.objects.length>=cap)return;const r=CONFIG.FIELD.objectRadius*S,pos=spawnPosition(r);if(!pos)return;let id,weight=0,toy=Math.random()<CONFIG.TOY_CHANCE;if(toy)id=CONFIG.TOYS[Math.floor(Math.random()*CONFIG.TOYS.length)];else{let choice=Math.random()*CONFIG.FOODS.reduce((s,f)=>s+f.chance,0);const f=CONFIG.FOODS.find(f=>(choice-=f.chance)<0)||CONFIG.FOODS[0];id=f.id;weight=f.weight}run.objects.push({...pos,r,id,weight,toy,age:0})}
function multiplier(streak=run.streak){let m=1;CONFIG.COMBO_THRESHOLDS.forEach((v,i)=>{if(streak>=v)m=i+1});return Math.min(5,m)}
function loseCombo(){if(multiplier()>=2){toast('COMBO VERLOREN');audio.play('lost')}run.streak=0}
function particles(x,y,color,count=10,power=1){for(let i=0;i<count&&run.fx.length<CONFIG.FX.maxParticles;i++){const a=rand(0,Math.PI*2),v=rand(35,130)*S*power;run.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20*S,life:rand(.35,.8),max:.8,color,r:rand(2,5)*S,star:i%3===0})}}
function label(x,y,text,color='#32694f'){run.labels.push({x,y,text,color,life:.8})}
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();audio.unlock();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,tol=settings().tolerance*S;const candidates=run.objects.filter(o=>Math.hypot(o.x-x,o.y-y)<=o.r+tol).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y));const o=candidates[0];if(!o)return;run.objects.splice(run.objects.indexOf(o),1);run.pops.push({...o,life:.18});if(o.toy){loseCombo();audio.play('bonk');label(o.x,o.y,'×','#b65d4e');particles(o.x,o.y,'#d89182',7)}else{const old=multiplier();run.saved++;run.streak++;run.best=Math.max(run.best,run.streak);const m=multiplier(),points=CONFIG.BASE_POINTS*m;run.score+=points;label(o.x,o.y,'+'+points);particles(o.x,o.y,'#d6b662');audio.play('pop',m);if(m>old){toast(m===5?'MAX COMBO ×5':'COMBO ×'+m);audio.play('combo',m);run.punch=.16;particles(W/2,bounds.top+28,'#9ebf6f',15)}}updateHUD()},{passive:false});
function consume(o){run.objects.splice(run.objects.indexOf(o),1);const c=run.cat;c.pause=settings().pause;c.chew=.28;if(o.toy){c.weight=Math.max(0,c.weight-CONFIG.TOY_LOSS);particles(o.x,o.y,'#99bda0',12);label(o.x,o.y,'−'+CONFIG.TOY_LOSS,'#578967');audio.play('toy')}else{c.weight=Math.min(100,c.weight+o.weight);loseCombo();label(o.x,o.y,'+'+o.weight+' Bauch','#b77550');audio.play('eat')}updateHUD();if(c.weight>=CONFIG.WEIGHT.max){state='exploding';run.explode=0;clearUIEffects();audio.stop()}}
function finish(win){state='result';clearUIEffects();audio.stop();if(mode==='endless'&&profile&&run.score>profile.highscore){profile.highscore=run.score;run.newHigh=true;save()}if(win||run.newHigh)audio.play('win');if(win){for(let i=0;i<5;i++)particles(rand(0,W),rand(bounds.top,H*.5),['#91b77b','#e4b667','#d8a1a0'][i%3],20,1.6)}const stats=[['Essen gerettet',run.saved],['Beste Combo','×'+multiplier(run.best)+' · '+run.best],['Überlebt',clock(run.time)],['Endgewicht',Math.round(run.cat.weight)+'/100']];showPanel(`<div class="eyebrow">${escapeHTML(mode==='endless'?profile.name:settings().name)}</div><h2>${win?'GESCHAFFT!':'ZU VIEL GEFRESSEN!'}</h2><p class="subtitle">${win?'Ein voller Erfolg. Und keine geplatzte Katze.':'Ein kleiner Plopp. Ein großer Appetit.'}</p>${mode==='endless'?`<div class="score-big">${fmt(run.score)}</div><div class="eyebrow">Punkte</div>${run.newHigh?'<p class="record">NEUER HIGHSCORE!</p>':''}<p class="subtitle">${run.newHigh?'Bisher: '+fmt(run.oldHigh)+' · ':''}Bestleistung: ${fmt(profile.highscore)}</p>`:''}<div class="stats">${stats.map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div><button class="primary" id="again">Nochmal</button><button class="secondary" id="back">Menü</button>${mode==='endless'?'<button class="text-button" id="leader">Bestenliste</button>':''}`);$('#again').onclick=()=>start();$('#back').onclick=menu;if($('#leader'))$('#leader').onclick=leaderboard}
function updateHUD(){if(!run)return;$('#metricLabel').textContent=mode==='endless'?'PUNKTE':'NOCH';$('#metric').textContent=mode==='endless'?fmt(run.score):clock(Math.ceil(Math.max(0,settings().duration-run.time)));const m=multiplier();$('#combo').textContent=m>=2?(m===5?'MAX COMBO':'COMBO')+' ×'+m:''}
// ── Simulation / Rendering ────────────────────────────────────────────────
function updateFX(dt){for(const f of run.fx){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=180*S*dt}run.fx=run.fx.filter(f=>f.life>0);for(const f of run.labels){f.life-=dt;f.y-=38*S*dt}run.labels=run.labels.filter(f=>f.life>0);for(const f of run.pops)f.life-=dt;run.pops=run.pops.filter(f=>f.life>0);run.punch=Math.max(0,run.punch-dt)}
function step(dt){if(!run)return;if(state==='playing'){const p=settings();const remaining=p.duration-run.time;if(dt>=remaining){run.time=p.duration;finish(true);return}run.time+=dt;run.spawn-=dt;if(run.spawn<=0){spawn();run.spawn=rand(...settings().interval)}for(const o of run.objects)o.age+=dt;const c=run.cat;c.displayWeight=lerp(c.displayWeight,c.weight,1-Math.exp(-dt*12));c.chew=Math.max(0,c.chew-dt);let moveDt=dt;if(c.pause>0){moveDt=Math.max(0,dt-c.pause);c.pause=Math.max(0,c.pause-dt)}c.moving=0;
 /* Re-evaluate every frame AND after every removal. Multiple arrivals use remaining time; no hidden pause in Unfair. */
 let budget=moveDt;for(let n=0;n<CONFIG.MAX_OBJECTS&&budget>0&&state==='playing';n++){const o=nearest();if(!o)break;const dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy),speed=settings().speed*S*weightSpeed(c.weight),gap=Math.max(0,d-radius()-o.r*.72);c.gaze={x:dx/(d||1),y:dy/(d||1)};if(Math.abs(dx)>3)c.dir=dx<0?-1:1;const travel=Math.min(gap,speed*budget);if(d>0){c.x+=dx/d*travel;c.y+=dy/d*travel}c.moving=travel>0?1:0;if(gap<=speed*budget){budget-=gap/speed;consume(o);if(c.pause>0){const used=Math.min(c.pause,budget);c.pause-=used;budget-=used;if(c.pause>0)break}}else break}updateFX(dt);updateHUD()
 }else if(state==='exploding'){run.explode+=dt;run.cat.displayWeight=lerp(run.cat.displayWeight,100,1-Math.exp(-dt*20));if(run.explode>.42&&!run.burst){run.burst=true;audio.play('boom');run.punch=.3;particles(run.cat.x,run.cat.y,'#f9f6e9',55,2.6);particles(run.cat.x,run.cat.y,'#dfb16c',35,2);label(run.cat.x,run.cat.y,'PLOPP!','#9a7251')}if(run.explode>CONFIG.FX.freeze)updateFX(dt);if(run.explode>CONFIG.FX.explosionDuration)finish(false)}else if(state==='result')updateFX(dt)}
function objectDraw(o,scale=1,alpha=1){const img=images[o.id];if(!img.complete)return;ctx.save();ctx.translate(o.x,o.y);ctx.globalAlpha=alpha;ctx.scale(scale,scale);ellipse(ctx,0,o.r*.7,o.r*.7,o.r*.19,'#596c4020');/* Icon art lies inside radius; exact circle never clips any visible ink. */ctx.drawImage(img,-o.r,-o.r,o.r*2,o.r*2);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#f0eddd';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#dce0cd';ctx.lineWidth=1;for(let x=0;x<W;x+=72*S){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=72*S){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#f9f5e955';ctx.fillRect(0,0,W,H);ctx.save();ctx.strokeStyle='#d0d8be';ctx.lineWidth=2;ctx.setLineDash([3,9]);ctx.strokeRect(10,10,W-20,H-20);ctx.restore();
 if(!run){for(let i=0;i<7;i++){const ids=Object.keys(ART);objectDraw({id:ids[i],x:W*(.09+(i%3)*.4),y:H*(.13+Math.floor(i/3)*.34),r:26*S},1,.35)}return}ctx.save();if(run.punch>0){const k=1+Math.sin(run.punch*25)*.006;ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-W/2,-H/2)}
 for(const o of run.objects)objectDraw(o,Math.min(1,o.age/.1));const c=run.cat;if(!run.burst){let stretch=1+Math.sin(visualTime*24)*c.chew*.14;if(state==='exploding')stretch=run.explode<.14?1:.8+Math.sin((run.explode-.14)*14)*.28;catDraw(ctx,c.x,c.y,S,c.displayWeight,visualTime,c.dir,c.gaze,c.moving,stretch);if(c.weight>=80){ctx.fillStyle='#a67454';ctx.font=`bold ${11*S}px system-ui`;ctx.textAlign='center';ctx.fillText('Ganz schön voll…',c.x,c.y+65*S*bodyScale(c.displayWeight))}}
 for(const p of run.pops){const t=1-p.life/.18;objectDraw(p,t<.3?1+t*.6:1.18*(1-(t-.3)/.7),1-t*.6)}for(const f of run.fx){ctx.globalAlpha=clamp(f.life/.3,0,1);ctx.fillStyle=f.color;if(f.star){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.life*5);ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?f.r*.4:f.r*1.3;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}else ellipse(ctx,f.x,f.y,f.r,f.r,f.color)}ctx.globalAlpha=1;for(const f of run.labels){ctx.save();ctx.globalAlpha=clamp(f.life/.2,0,1);ctx.translate(f.x,f.y-15*S);const z=1+Math.sin((1-f.life/.8)*Math.PI)*.12;ctx.scale(z,z);ctx.font=`900 ${18*S}px system-ui`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff9eb';ctx.strokeText(f.text,0,0);ctx.fillStyle=f.color;ctx.fillText(f.text,0,0);ctx.restore()}ctx.restore()}
function drawHero(){if(!hero)return;const r=hero.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(hero.width!==Math.round(r.width*d)||hero.height!==Math.round(r.height*d)){hero.width=Math.round(r.width*d);hero.height=Math.round(r.height*d)}const c=hero.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);ellipse(c,r.width/2,r.height*.68,80,22,'#e7eccf');catDraw(c,r.width/2,r.height*.53+Math.sin(visualTime*2)*2,r.height/111,32,visualTime,1,{x:Math.sin(visualTime*.6)*.5,y:0},.1)}
function frame(now){const dt=clamp((now-lastFrame)/1000,0,.033);lastFrame=now;if(state!=='paused')visualTime+=dt;step(dt);draw();drawHero();if(noticeTime>0&&state!=='paused')noticeTime-=dt;requestAnimationFrame(frame)}
window.addEventListener('resize',resize);document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.title=CONFIG.TITLE;resize();menu();soundButtons();requestAnimationFrame(frame);
</script></body></html>
